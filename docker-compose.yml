services:
  desafio01-db:
    image: pgvector/pgvector:pg17
    container_name: desafio01-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  desafio01-app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_EMBEDDING_MODEL: ${GOOGLE_EMBEDDING_MODEL:-gemini-embedding-001}
      GOOGLE_LLM_MODEL: ${GOOGLE_LLM_MODEL:-gemini-2.5-flash-lite}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_HOST: desafio01-db
      POSTGRES_PORT: 5432
      PG_VECTOR_COLLECTION_NAME: ${PG_VECTOR_COLLECTION_NAME:-pdf_chunks}
      PDF_PATH: ${PDF_PATH:-document.pdf}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-5}
      INGEST_BATCH_DELAY_SECONDS: ${INGEST_BATCH_DELAY_SECONDS:-1}
      INGEST_MAX_TOKENS_PER_MINUTE: ${INGEST_MAX_TOKENS_PER_MINUTE:-20000}
    volumes:
      - .:/app
    depends_on:
      desafio01-db:
        condition: service_healthy

volumes:
  postgres_data:
